<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="max-image-preview:large" />
    <meta name="theme-color" content="#f7f5ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-light.png" media="(prefers-color-scheme: light)" sizes="64x64" />
    <link rel="icon" href="/assets/favicon-dark.png" media="(prefers-color-scheme: dark)" sizes="64x64" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preload" href="/assets/brand/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/inter-regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Before first paint: the remembered theme, and whether motion is welcome. With motion, the home lockup
      // draws itself on every page load; with reduced motion it opens straight onto the finished mark.
      try {
        var root = document.documentElement
        var theme = localStorage.getItem("md-theme")
        if (theme === "light" || theme === "dark") root.dataset.theme = theme
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          root.dataset.motion = "ok"
          root.dataset.intro = "1"
        }
      } catch (e) {}
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
