<!doctype html>
<html lang="en" data-direction="b">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="max-image-preview:large" />
    <link rel="icon" href="/assets/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/assets/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <script>
      // Local direction comparison: apply a stored direction before first paint (dev hosts only).
      try {
        if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
          var d = new URLSearchParams(location.search).get("direction") || localStorage.getItem("md-direction")
          if (/^[abd]$/.test(d)) document.documentElement.dataset.direction = d
        }
      } catch (e) {}
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
